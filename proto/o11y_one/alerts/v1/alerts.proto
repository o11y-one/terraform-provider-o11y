  bool delivery_current = 4;
  bool source_materializer_current = 5;
  bool definition_authoring_available = 6;
  bool slo_authoring_available = 7;
  bool notify_delivery_available = 8;
  string status = 9;
  repeated AlertRuntimeCapabilityBlockerV1 blockers = 10;
  google.protobuf.Timestamp checked_at = 11;
  bool live_objectives_configured = 12;
  reserved 13;
  reserved "live_objectives_rollout";
  bool live_objectives_current = 14;
  repeated AlertRuntimeHealthDimensionV1 objective_health = 15;
  repeated AlertRuntimeObjectiveCapacityV1 objective_capacity = 16;
  bool live_objectives_authoritative = 17;
  // One row per objective replica, in the order the bridge polled them.
  // `objective_health` is per (replica, dimension) and cannot answer questions
  // about the replica itself.
  repeated AlertRuntimeObjectiveReplicaV1 objective_replicas = 18;
}

message AlertRuntimeHealthDimensionV1 {
  string replica_id = 1;
  string dimension = 2;
  string state = 3;
  string reason = 4;
  google.protobuf.Timestamp observed_at = 5;
}

// Per-replica objective runtime facts, carried from ObjectiveHealthV1.
//
// These are replica-scoped, not dimension-scoped: a parked replica A beside a
// healthy replica B must stay distinguishable, and a replica that reports no
// dimensions at all still has to report whether it is parked. Both are reasons
// this is its own row rather than extra columns on
// AlertRuntimeHealthDimensionV1.
message AlertRuntimeObjectiveReplicaV1 {
  string replica_id = 1;
  // The replica's aggregate verdict: "ready", "degraded", "not_ready", "error".
  // Read this rather than rolling up the dimension rows client-side.
  string state = 2;
  // Whether a complete plan catalog has been installed on this replica.
  //
  // False means the replica is parked: it is serving and healthy but will not
  // consume, so any backlog in its consumer groups is frozen rather than
  // lagging. True with active_plan_tenant_count == 0 is a different state — the
  // catalog installed but carries no active plans, and the replica IS
  // consuming.
  //
  // These two fields exist so the parked / no-SLOs-configured / normal decision
  // is made from the message rather than from the `plans` dimension's reason
  // string, which is prose and has already moved once.
  bool plan_catalog_installed = 3;
  uint32 active_plan_tenant_count = 4;
  // Highest per-tenant plan generation in the accepted catalog, or 0 when no
  // catalog has been installed. Monotonic per tenant, so a rising value means
  // the catalog advanced and equal values across two polls mean the same
  // catalog is installed.
  int64 plan_generation = 5;
  uint32 expected_partition_count = 6;
  uint32 observed_partition_count = 7;
  google.protobuf.Timestamp observed_at = 8;
}

// Per-endpoint mirror of ObjectiveCapacityV1 (objectives/v1). Same two-class split:
// rows-per-second fields are DECLARED operator configuration, the *_rows counters are
// MEASURED from the commit path. In particular `supported_rows_per_second` restates a config
// constant and is not an observed throughput (#154).
message AlertRuntimeObjectiveCapacityV1 {
  string endpoint_key = 1;
  uint64 normalized_rows_per_second = 2;
  uint64 objective_rows_per_second = 3;
  uint64 persistence_rows_per_second = 4;
  // DECLARED, not measured: see message comment.
  uint64 supported_rows_per_second = 5;
  uint64 reserved_headroom_rows_per_second = 6;
  uint64 tenant_reserved_rows_per_second = 7;
  uint64 admitted_rows = 8;
  uint64 throttled_rows = 9;
  uint64 rejected_rows = 10;
  uint64 buffered_rows = 11;
  uint64 delayed_rows = 12;
  uint64 lag_budget_rows = 13;
  uint64 freshness_deadline_millis = 14;
  bool backpressure_required = 15;
  string reason = 16;
  google.protobuf.Timestamp observed_at = 17;
}

