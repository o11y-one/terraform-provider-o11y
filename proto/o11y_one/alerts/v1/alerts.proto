// ---------------------------------------------------------------------------
// Service telemetry profile (SLI authoring, tier 2 of the SLI telemetry
// perspective spec).
//
// A trace service SLI that names no span kinds is given span_kinds=["server"].
// For a service that serves no requests, that default excludes every span it
// emits and the SLI can never match its own telemetry. These messages let the
// authoring UI show the author what perspective a service actually has, before
// the scope is saved.
// ---------------------------------------------------------------------------

message GetServiceTelemetryProfileRequest {
  // The service to profile, as it appears in `service.name`.
  string service_name = 1;
  // Lookback in seconds. Zero means the authoring default of 24h. Requests are
  // rounded up to a supported window so authoring sessions share one snapshot.
  int64 window_seconds = 2;
}

// One span kind's presence in a service's telemetry.
message ServiceTelemetrySpanKindV1 {
  // The kind in the SLI scope's own vocabulary, so a client can compare it to
  // AlertScopeV1.span_kinds without a mapping.
  SliSpanKindV1 kind = 1;
  // Display form of the same kind ("server", "client", ...), which is also the
  // spelling the scope editor uses.
  string kind_label = 2;
  int64 span_count = 3;
  // Fraction of the service's spans in the window, in [0, 1].
  double share = 4;
  // The normalized trace column's own spelling, e.g. "SPAN_KIND_CLIENT". Use
  // this when correlating a profile against raw telemetry; use `kind` when
  // comparing against an SLI scope.
  string kind_wire_name = 5;
  // Span duration quantiles for this kind over the window, in milliseconds. Unset
  // when the window's files predate the stored duration.
  optional double latency_p50_ms = 6;
  optional double latency_p95_ms = 7;
  optional double latency_p99_ms = 8;
  // Spans of this kind the pipeline marked failed. With `span_count` it is the kind's observed success rate, and
  // it adds across kinds, so a service-wide rate is a sum. Unset when the window's files carry no failure mark.
  optional int64 error_count = 9;
}

// A semantic domain the service's spans belong to.
message ServiceTelemetryDomainV1 {
  // Open vocabulary drawn from the ingest classifier taxonomy: http, rpc,
  // graphql, db, cache, messaging, gen_ai, faas, dns. A domain the classifier
  // could not place is not reported at all.
  string domain = 1;
  // Concrete systems behind the domain — postgresql, redis, kafka, openai.
  // Empty for domains that have no system attribute.
  repeated string systems = 2;
  int64 span_count = 3;
}

// What the profile was computed from.
message ServiceTelemetrySampleV1 {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end = 2;
  int64 window_seconds = 3;
  // Age of the newest span seen for this service. Zero when the service emitted
  // nothing in the window; read has_recent_telemetry to tell those apart.
  int64 freshness_millis = 4;
  int64 total_spans = 5;
  // When the snapshot behind this answer was computed. Reads are served from a
  // cached snapshot, so this trails the request by up to the snapshot TTL.
  google.protobuf.Timestamp observed_at = 6;
  // Age of that snapshot at the moment this response was built, so a client can
  // render "as of 12s ago" without subtracting server time from its own clock.
  // Always present and always >= 0; a fresh fill reads 0.
  int64 snapshot_age_millis = 7;
}

// A scope the author could adopt, with the observation that motivates it.
//
// Never suggests "server": that is already the injected default, so offering it
// tells the author nothing. Everything here names a perspective the default
// would otherwise have hidden.
message ServiceTelemetryScopeSuggestionV1 {
  repeated SliSpanKindV1 span_kinds = 1;
  // Renderable form of the fragment, e.g. `span_kinds=["client"]`. Empty when
  // the suggestion is not a span-kind scope at all.
  string scope_fragment = 2;
  // End-customer language, e.g. "98% of this service's spans are client".
  string reason = 3;
  // Set when the suggestion is about what to measure rather than where to scope
  // it, so a client never has to read `reason` to find out.
  SliIndicatorKindV1 suggested_indicator_kind = 4;
}

// A service with no telemetry in the window is a valid answer, not an error:
// every repeated field is empty and has_recent_telemetry is false.
message GetServiceTelemetryProfileResponse {
  string service_name = 1;
  // Descending by span_count.
  repeated ServiceTelemetrySpanKindV1 span_kinds = 2;
  // Descending by span_count.
  repeated ServiceTelemetryDomainV1 domains = 3;
  ServiceTelemetrySampleV1 sampled = 4;
  repeated ServiceTelemetryScopeSuggestionV1 suggestions = 5;
  bool has_recent_telemetry = 6;
}

service AlertTelemetryProfileService {
  rpc GetServiceTelemetryProfile(GetServiceTelemetryProfileRequest) returns (GetServiceTelemetryProfileResponse);
}


// The disposition an SLO mutation carries for the burn alerts that evaluate
// against it. Exactly one of `all` or `entries` is set; `entries` must decide
// every affected alert, because a partial list is the silence this contract
// exists to remove.
message SloBurnAlertDispositionV1 {
  SloBurnAlertDispositionActionV1 all = 1;
  repeated SloBurnAlertDispositionEntryV1 entries = 2;
}

message SloBurnAlertDispositionEntryV1 {
  string alert_id = 1;
  SloBurnAlertDispositionActionV1 action = 2;
}

enum SloBurnAlertDispositionActionV1 {
  SLO_BURN_ALERT_DISPOSITION_ACTION_V1_UNSPECIFIED = 0;
  // Re-pin to the new revision. The burn multipliers carry unchanged; only the
  // frozen target/window/mode snapshot is rewritten.
  SLO_BURN_ALERT_DISPOSITION_ACTION_V1_UPDATE = 1;
  // Stop the alert evaluating. It keeps its definition and its history.
  SLO_BURN_ALERT_DISPOSITION_ACTION_V1_DETACH = 2;
  // Knowingly leave it on the superseded revision. Lands in needs-review.
  SLO_BURN_ALERT_DISPOSITION_ACTION_V1_KEEP_PINNED = 3;
}

// One burn window's absolute trigger condition, computed server-side.
message SloBurnThresholdPreviewV1 {
  // "fast" or "slow".
  string window_label = 1;
  // The budget-relative multiplier the alert was authored with, e.g. 14.4.
  double burn_rate_multiplier = 2;
  // The absolute error rate that trips this condition, as a ratio.
  double error_rate_threshold = 3;
  int64 short_window_seconds = 4;
  int64 long_window_seconds = 5;
  // The rendered sentence. Server-authored so a refusal payload and a preview
  // cannot describe the same threshold differently.
  string summary = 6;
}

// What an SLO change means for one of its burn alerts.
message SloBurnAlertImpactV1 {
  string alert_id = 1;
  string alert_name = 2;
  string slo_id = 3;
  string pinned_slo_revision_id = 4;
  double current_target_ratio = 5;
  int64 current_slo_window_seconds = 6;
  repeated SloBurnThresholdPreviewV1 current_thresholds = 7;
  // Empty when nothing is proposed — the SLO's own page asks what its alerts
  // mean today, with no change in flight.
  double proposed_target_ratio = 8;
  int64 proposed_slo_window_seconds = 9;
  repeated SloBurnThresholdPreviewV1 proposed_thresholds = 10;
  // Mirrors AlertDefinitionRuntimeSummaryV1: empty unless already parked.
  string needs_review_reason = 11;
}

message PreviewSloBurnAlertImpactRequest {
  string slo_id = 1;
  // Omit to describe the alerts as they stand; supply a proposed revision to
  // get the before/after an operator confirms against.
  SloRevisionInputV1 proposed_revision = 2;
}

message PreviewSloBurnAlertImpactResponse {
  repeated SloBurnAlertImpactV1 alerts = 1;
}
