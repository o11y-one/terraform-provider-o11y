syntax = "proto3";

package o11y_one.alerts.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

enum AlertClassV1 {
  ALERT_CLASS_V1_UNSPECIFIED = 0;
  ALERT_CLASS_V1_OUTCOME = 1;
  ALERT_CLASS_V1_BUDGET = 2;
  ALERT_CLASS_V1_SYMPTOM = 3;
  ALERT_CLASS_V1_SYSTEM = 4;
}

enum AlertModeV1 {
  option allow_alias = true;
  ALERT_MODE_V1_UNSPECIFIED = 0;
  // Evaluates against live data and records predicted notifications without
  // contacting recipients. The durable runtime/storage name remains shadow.
  ALERT_MODE_V1_OBSERVE = 1;
  ALERT_MODE_V1_SHADOW = 1 [deprecated = true];
  ALERT_MODE_V1_NOTIFY = 2;
  ALERT_MODE_V1_DISABLED = 3;
}

enum AlertSeverityV1 {
  ALERT_SEVERITY_V1_UNSPECIFIED = 0;
  ALERT_SEVERITY_V1_INFO = 1;
  ALERT_SEVERITY_V1_WARNING = 2;
  ALERT_SEVERITY_V1_CRITICAL = 3;
}

enum AlertDestinationKindV1 {
  ALERT_DESTINATION_KIND_V1_UNSPECIFIED = 0;
  ALERT_DESTINATION_KIND_V1_EMAIL = 1;
  ALERT_DESTINATION_KIND_V1_WEBHOOK = 2;
  ALERT_DESTINATION_KIND_V1_SLACK = 3;
  ALERT_DESTINATION_KIND_V1_PAGERDUTY = 4;
}

message AlertOwnerRefV1 {
  oneof owner {
    string team_id = 1;
    string user_id = 2;
  }
  string display_name = 3;
  bool active = 4;
}

message AlertActionV1 {
  string summary = 1;
  string first_action = 2;
  string managed_runbook_id = 3;
  string external_runbook_url = 4;
  string managed_runbook_revision_id = 5;
}

message AlertStringListV1 { repeated string values = 1; }

message AlertScalarValueV1 {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    AlertStringListV1 string_list = 5;
    uint64 uint_value = 6;
  }
}

message AlertAttributeV1 {
  string key = 1;
  AlertScalarValueV1 value = 2;
}

// Bounded extension point for detector evidence and provider diagnostics. Values
// are deliberately scalar or string-list only; arbitrary nested JSON is not part
// of the alerts API contract.
message AlertAttributeSetV1 { repeated AlertAttributeV1 attributes = 1; }

message AlertLabelsV1 { map<string, string> values = 1; }

message SliEventDescriptionV1 { string count = 1; }

message AlertEvidenceRefV1 {
  string kind = 1;
  string id = 2;
  AlertAttributeSetV1 attributes = 3;
  string dimension_hash = 4;
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
}

message AlertDetectorEvidenceV1 {
  string kind = 1;
  string id = 2;
  AlertAttributeSetV1 attributes = 3;
}

message AgentQualityRegressionConfigV1 {
  optional int64 short_window_seconds = 1;
  optional int64 long_window_seconds = 2;
  optional int64 baseline_window_seconds = 3;
  optional uint64 min_run_count = 4;
  optional double max_bad_outcome_rate = 5;
  optional double max_eval_fail_rate = 6;
  optional double min_eval_pass_rate = 7;
  optional double baseline_bad_outcome_rate = 8;
  optional double regression_multiplier = 9;
  optional uint32 evidence_limit = 10;
  // Read the v2 eval_run_quality fact family (evaluation runs and their
  // candidate/scorer projections) instead of the legacy agent_outcome +
  // eval_quality pair, which reads the eval_scores plane the v2 evaluation path
  // never writes. Absent or false keeps the legacy behaviour exactly.
  optional bool use_run_quality_facts = 11;
}

message CostPerSuccessConfigV1 {
  optional int64 window_seconds = 1;
  optional uint64 min_success_count = 2;
  optional double max_cost_per_success_usd = 3;
  optional double baseline_cost_per_success_usd = 4;
  optional double regression_multiplier = 5;
  optional bool allow_estimated_cost = 6;
  optional double budget_remaining_usd = 7;
  optional double imminent_exhaustion_hours = 8;
  optional uint32 evidence_limit = 9;
}

message SloBurnConfigV1 {
  optional int64 fast_short_window_seconds = 1;
  optional int64 fast_long_window_seconds = 2;
  optional int64 slow_short_window_seconds = 3;
  optional int64 slow_long_window_seconds = 4;
  optional int64 slo_window_seconds = 5;
  optional double target_percent = 6;
  optional double fast_burn_threshold = 7;
  optional double slow_burn_threshold = 8;
  optional uint64 min_request_count = 9;
  optional uint32 evidence_limit = 10;
  string slo_id = 11;
  string slo_revision_id = 12;
  reserved 13 to 15;
  reserved "fact_family", "eligible_event_field", "good_event_field";
  SloWindowModeV1 window_mode = 16;
  SloCalendarPeriodV1 calendar_period = 17;
  string calendar_timezone = 18;
  google.protobuf.Timestamp revision_effective_from = 19;
}

enum SliIndicatorKindV1 {
  SLI_INDICATOR_KIND_V1_UNSPECIFIED = 0;
  SLI_INDICATOR_KIND_V1_AVAILABILITY = 1;
  SLI_INDICATOR_KIND_V1_LATENCY = 2;
  SLI_INDICATOR_KIND_V1_AGENT_OUTCOME = 3;
  SLI_INDICATOR_KIND_V1_EVAL_QUALITY = 4;
  SLI_INDICATOR_KIND_V1_TOOL_SUCCESS = 5;
  SLI_INDICATOR_KIND_V1_COST_PER_SUCCESSFUL_OUTCOME = 6;
  SLI_INDICATOR_KIND_V1_EVENT_CONDITION = 7;
}

enum SliSignalV1 {
  SLI_SIGNAL_V1_UNSPECIFIED = 0;
  SLI_SIGNAL_V1_TRACES = 1;
  SLI_SIGNAL_V1_LOGS = 2;
  SLI_SIGNAL_V1_METRICS = 3;
}

enum SliAggregationV1 {
  SLI_AGGREGATION_V1_UNSPECIFIED = 0;
  SLI_AGGREGATION_V1_EVENT_RATIO = 1;
  SLI_AGGREGATION_V1_THRESHOLD_RATIO = 2;
}

enum SliMissingDataBehaviorV1 {
  SLI_MISSING_DATA_BEHAVIOR_V1_UNSPECIFIED = 0;
  SLI_MISSING_DATA_BEHAVIOR_V1_UNKNOWN = 1;
  SLI_MISSING_DATA_BEHAVIOR_V1_GOOD = 2;
  SLI_MISSING_DATA_BEHAVIOR_V1_BAD = 3;
}

enum SloWindowModeV1 {
  SLO_WINDOW_MODE_V1_UNSPECIFIED = 0;
  SLO_WINDOW_MODE_V1_ROLLING = 1;
  SLO_WINDOW_MODE_V1_CALENDAR = 2;
}

enum SloCalendarPeriodV1 {
  SLO_CALENDAR_PERIOD_V1_UNSPECIFIED = 0;
  SLO_CALENDAR_PERIOD_V1_DAY = 1;
  SLO_CALENDAR_PERIOD_V1_WEEK = 2;
  SLO_CALENDAR_PERIOD_V1_MONTH = 3;
  SLO_CALENDAR_PERIOD_V1_QUARTER = 4;
}

// How much of the window a value was computed over is actually accounted for.
//
// One value per state of the objectives-side ObjectiveCoverageStateV1, so every
// state the evaluator can report crosses the bridge under its own name rather
// than being collapsed into a neighbour. UNAVAILABLE is the one value with no
// objectives counterpart: it means the bridge itself could not state coverage.
//
// Always pair the state with the companion coverage_reason, which is prose
// written for display.
enum SliCoverageStateV1 {
  SLI_COVERAGE_STATE_V1_UNSPECIFIED = 0;
  // Every expected minute is present and final.
  SLI_COVERAGE_STATE_V1_COMPLETE = 1;
  // The window was accounted for and held no eligible events. Render as
  // "no data", never as 0%.
  SLI_COVERAGE_STATE_V1_NO_DATA = 2;
  // Some expected minutes are missing from the window.
  SLI_COVERAGE_STATE_V1_PARTIAL = 3;
  // The bridge could not state coverage for the window.
  SLI_COVERAGE_STATE_V1_UNAVAILABLE = 4;
  // Every event in the window was excluded by the SLI. Distinct from NO_DATA:
  // traffic did arrive, and the indicator filtered all of it out.
  SLI_COVERAGE_STATE_V1_EXCLUDED_ONLY = 5;
  // Some minutes in the window are stale.
  SLI_COVERAGE_STATE_V1_STALE = 6;
  // The window contains evaluator errors. Do not present its ratio as
  // authoritative.
  SLI_COVERAGE_STATE_V1_ERROR = 7;
}

enum SliTelemetryFilterOperatorV1 {
  SLI_TELEMETRY_FILTER_OPERATOR_V1_UNSPECIFIED = 0;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_EQUALS = 1;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_NOT_EQUALS = 2;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_IN = 3;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_NOT_IN = 4;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_EXISTS = 5;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_NOT_EXISTS = 6;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_LESS_THAN = 7;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_LESS_THAN_OR_EQUAL = 8;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_GREATER_THAN = 9;
  SLI_TELEMETRY_FILTER_OPERATOR_V1_GREATER_THAN_OR_EQUAL = 10;
}

enum SliTelemetryAttributeSourceV1 {
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_UNSPECIFIED = 0;
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_FIXED = 1;
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_SPAN = 2;
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_RESOURCE = 3;
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_SCOPE = 4;
  SLI_TELEMETRY_ATTRIBUTE_SOURCE_V1_LOG = 5;
}

message SliTelemetryAttributeFilterV1 {
  string field = 1;
  SliTelemetryFilterOperatorV1 operator = 2;
  // Compatibility input for existing string-only clients. New clients should
  // use typed_values so numeric and boolean comparisons remain type-safe.
  repeated string values = 3;
  SliTelemetryAttributeSourceV1 source = 4;
  repeated AlertScalarValueV1 typed_values = 5;
}

enum SliSpanKindV1 {
  SLI_SPAN_KIND_V1_UNSPECIFIED = 0;
  SLI_SPAN_KIND_V1_INTERNAL = 1;
  SLI_SPAN_KIND_V1_SERVER = 2;
  SLI_SPAN_KIND_V1_CLIENT = 3;
  SLI_SPAN_KIND_V1_PRODUCER = 4;
  SLI_SPAN_KIND_V1_CONSUMER = 5;
}

enum SliReadinessStateV1 {
  SLI_READINESS_STATE_V1_UNSPECIFIED = 0;
  SLI_READINESS_STATE_V1_READY = 1;
  SLI_READINESS_STATE_V1_NO_MATCHING_TRAFFIC = 2;
  SLI_READINESS_STATE_V1_SOURCE_LAGGING = 3;
  SLI_READINESS_STATE_V1_BACKFILLING = 4;
  SLI_READINESS_STATE_V1_MATERIALIZATION_BLOCKED = 5;
  SLI_READINESS_STATE_V1_COVERAGE_GAP = 6;
  SLI_READINESS_STATE_V1_SELECTOR_UNSUPPORTED = 7;
  // Telemetry reached the evaluator under this SLI's service, and the SLI
  // counted none of it because its span-kind scope matched nothing.
  //
  // Distinct from NO_MATCHING_TRAFFIC, which is the absence of telemetry. This
  // state says the scope, not the pipeline, is why the SLI is empty, and it is
  // only claimed when excluded telemetry was observed under the scoped service.
  SLI_READINESS_STATE_V1_SCOPE_TELEMETRY_MISMATCH = 8;
}

// Why an SLI that has telemetry counted none of it.
//
// Carried on the readiness of a SCOPE_TELEMETRY_MISMATCH answer so the reader
// can name the filter that emptied the SLI and jump to the control that owns
// it. The observed kind distribution of the excluded telemetry is not here: the
// evaluator records exclusion as a single count with no per-cause attribution,
// so the distribution arrives with the service telemetry profile.
message SliScopeTelemetryMismatchV1 {
  // The span-kind filter in effect when the mismatch was observed.
  repeated SliSpanKindV1 span_kinds = 1;
  // Whether the filter above was supplied by the server rather than chosen by
  // the author. See AlertSliRevisionV1.defaulted_fields.
  bool span_kinds_defaulted = 2;
  // The service the excluded telemetry was observed under, which is the service
  // this SLI is scoped to.
  string service_name = 3;
  // Events evaluated over the window that this SLI did not count. This is the
  // whole excluded count, which is not attributable to the span-kind arm alone.
  int64 excluded_event_count = 4;
}

message SliReadinessV1 {
  SliReadinessStateV1 state = 1;
  string reason = 2;
  google.protobuf.Timestamp materialized_through = 3;
  google.protobuf.Timestamp source_frontier = 4;
  google.protobuf.Timestamp first_blocked_minute = 5;
  int64 matching_event_count = 6;
  string blocker = 7;
  // How old the served values are, when they were not read from a running
  // evaluator. Absent means the read was current.
  //
  // This is serving staleness, which is not the same quantity as
  // `SloDataFreshnessV1.materialization_lag_seconds`: that one says how far
  // behind the evaluated data is, this one says how long ago this answer was
  // last true. A restarting evaluator produces the second without changing the
  // first.
  optional int64 staleness_millis = 8;
  // The evaluator supervision state that produced this answer: "running",
  // "starting", "catching_up", "restarting", "degraded", "stopped",
  // "unwired". Empty when the read was current.
  //
  // Read this with `blocker` to render partial degradation: an objective that
  // has never been evaluated carries blocker "objective_provisioning", which
  // is a new SLO waiting for its first minute rather than a broken one.
  string evaluator_state = 9;
  // Present only under SCOPE_TELEMETRY_MISMATCH, naming the scope that emptied
  // the SLI.
  SliScopeTelemetryMismatchV1 scope_mismatch = 10;
}

message AlertSliRevisionV1 {
  string id = 1;
  string sli_id = 2;
  int32 revision_number = 3;
  SliIndicatorKindV1 indicator_kind = 4;
  AlertScopeV1 scope = 5;
  AlertOwnerRefV1 owner = 6;
  SliEventDescriptionV1 eligible_events = 7;
  SliEventDescriptionV1 good_events = 8;
  SliEventDescriptionV1 excluded_events = 9;
  SliAggregationV1 aggregation = 10;
  optional double threshold = 11 [deprecated = true];
  SliMissingDataBehaviorV1 missing_data_behavior = 12;
  string config_hash = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Duration latency_threshold = 16;
  // Unspecified historical requests and rows are normalized to traces.
  SliSignalV1 signal = 17;
  // AND-combined typed conditions that define a good eligible event. Empty
  // retains the built-in recipe semantics for compatible indicator kinds.
  repeated SliTelemetryAttributeFilterV1 good_event_filters = 18;
  // Scope fields carrying a server-supplied value rather than an authored one,
  // so a reader can render "server (default)" instead of presenting the default
  // as a choice. Today the only member is "span_kinds", which a trace service
  // SLI receives when the author names no kinds.
  //
  // `scope` above is always the effective scope, default included, so this
  // marks provenance and never changes what the scope is.
  repeated string defaulted_fields = 19;
  // The subset of `defaulted_fields` that was read from the default's value
  // rather than from recorded provenance, because the revision predates the
  // provenance marker. Such a field is server-supplied *or* was chosen by an
  // author who picked exactly the default — the two are indistinguishable in
  // storage — so a reader that draws a hard claim should soften it to "looks
  // like the default" for these. Empty for every revision written since.
  repeated string inferred_defaulted_fields = 20;
}

message AlertSliV1 {
  string id = 1;
  string sli_key = 2;
  string name = 3;
  string description = 4;
  string current_revision_id = 5;
  string provenance = 6;
  google.protobuf.Timestamp archived_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  AlertSliRevisionV1 current_revision = 10;
  AlertManagedResourceV1 management = 11;
}

message SliRevisionInputV1 {
  SliIndicatorKindV1 indicator_kind = 1;
  AlertScopeV1 scope = 2;
  AlertOwnerRefV1 owner = 3;
  SliEventDescriptionV1 eligible_events = 4;
  SliEventDescriptionV1 good_events = 5;
  SliEventDescriptionV1 excluded_events = 6;
  SliAggregationV1 aggregation = 7;
  optional double threshold = 8 [deprecated = true];
  SliMissingDataBehaviorV1 missing_data_behavior = 9;
  google.protobuf.Duration latency_threshold = 10;
  SliSignalV1 signal = 11;
  repeated SliTelemetryAttributeFilterV1 good_event_filters = 12;
}

message CreateSliRequest {
  string sli_key = 1;
  string name = 2;
  string description = 3;
  SliRevisionInputV1 revision = 4;
  string idempotency_key = 5;
}

message UpdateSliRequest {
  string sli_id = 1;
  string expected_revision_id = 2;
  string name = 3;
  string description = 4;
  SliRevisionInputV1 revision = 5;
  string idempotency_key = 6;
}

message ValidateSliRequest { SliRevisionInputV1 revision = 1; }

message ValidateSliResponse {
  bool valid = 1;
  repeated AlertFieldViolationV1 violations = 2;
  repeated double supported_latency_thresholds_ms = 3 [deprecated = true];
  repeated double supported_cost_thresholds_usd = 4;
  double minimum_latency_threshold_ms = 5;
  double maximum_latency_threshold_ms = 6;
}

message GetSliRequest { string sli_id = 1; }

message ListSlisRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool include_archived = 3;
}

message ListSlisResponse {
  repeated AlertSliV1 items = 1;
  int64 total_count = 2;
}

message ArchiveSliRequest {
  string sli_id = 1;
  string idempotency_key = 2;
}

message ListSliRevisionsRequest {
  string sli_id = 1;
  int32 limit = 2;
}

message ListSliRevisionsResponse { repeated AlertSliRevisionV1 items = 1; }

message PreviewSliRequest {
  string sli_id = 1;
  string sli_revision_id = 2;
  google.protobuf.Timestamp range_start = 3;
  google.protobuf.Timestamp range_end = 4;
  optional uint32 evidence_limit = 5;
}

// Previews an SLI that has not been saved. It is computed in memory from the telemetry lake by the evaluator a
// saved SLI runs on, and nothing is persisted. The response's sli_id and sli_revision_id are empty.
message PreviewSliRevisionRequest {
  SliRevisionInputV1 revision = 1;
  google.protobuf.Timestamp range_start = 2;
  google.protobuf.Timestamp range_end = 3;
  optional uint32 evidence_limit = 4;
}

message SliPreviewV1 {
  string sli_id = 1;
  string sli_revision_id = 2;
  google.protobuf.Timestamp range_start = 3;
  google.protobuf.Timestamp range_end = 4;
  int64 eligible_event_count = 5;
  int64 good_event_count = 6;
  int64 bad_event_count = 7;
  int64 excluded_event_count = 8;
  optional double indicator_value = 9;
  SliCoverageStateV1 coverage_state = 10;
  string coverage_reason = 11;
  google.protobuf.Timestamp source_frontier = 12;
  repeated AlertEvidenceRefV1 evidence = 13;
  bool evidence_truncated = 14;
  SliReadinessV1 readiness = 15;
  // Rows the lateness cutoff dropped across the previewed range, and how many of
  // its minutes contributed one. A preview whose counts look thin because its
  // slowest events never arrived says so here rather than reading as complete.
  int64 late_excluded_event_count = 16;
  int64 late_lossy_minute_count = 17;
}

message AlertSloRevisionV1 {
  string id = 1;
  string slo_id = 2;
  int32 revision_number = 3;
  string sli_id = 4;
  string sli_revision_id = 5;
  double target_ratio = 6;
  int64 rolling_window_seconds = 7;
  AlertOwnerRefV1 owner = 8;
  AlertLabelsV1 labels = 9;
  string config_hash = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  SloWindowModeV1 window_mode = 13;
  SloCalendarPeriodV1 calendar_period = 14;
  string calendar_timezone = 15;
  google.protobuf.Timestamp effective_from = 16;
  int64 maximum_window_seconds = 17;
}

message AlertSloV1 {
  string id = 1;
  string slo_key = 2;
  string name = 3;
  string description = 4;
  string current_revision_id = 5;
  string provenance = 6;
  google.protobuf.Timestamp archived_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  AlertSloRevisionV1 current_revision = 10;
  AlertManagedResourceV1 management = 11;
}

message SloRevisionInputV1 {
  string sli_id = 1;
  string sli_revision_id = 2;
  double target_ratio = 3;
  int64 rolling_window_seconds = 4;
  AlertOwnerRefV1 owner = 5;
  AlertLabelsV1 labels = 6;
  SloWindowModeV1 window_mode = 7;
  SloCalendarPeriodV1 calendar_period = 8;
  string calendar_timezone = 9;
}

message CreateSloRequest {
  string slo_key = 1;
  string name = 2;
  string description = 3;
  SloRevisionInputV1 revision = 4;
  string idempotency_key = 5;
}

message UpdateSloRequest {
  string slo_id = 1;
  string expected_revision_id = 2;
  string name = 3;
  string description = 4;
  SloRevisionInputV1 revision = 5;
  string idempotency_key = 6;
  // Required when this change mints a new SLO revision and the SLO has live
  // burn alerts. Omitting it returns FAILED_PRECONDITION with the affected
  // alerts and their before/after trigger conditions, and applies nothing.
  SloBurnAlertDispositionV1 burn_alert_disposition = 7;
}

message GetSloRequest { string slo_id = 1; }

message ListSlosRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool include_archived = 3;
}

message ListSlosResponse {
  repeated AlertSloV1 items = 1;
  int64 total_count = 2;
}

message ArchiveSloRequest {
  string slo_id = 1;
  string idempotency_key = 2;
  // Same contract as UpdateSlo, minus UPDATE: an archived SLO has no
  // successor revision to re-pin a burn alert to.
  SloBurnAlertDispositionV1 burn_alert_disposition = 3;
}

message ListSloRevisionsRequest {
  string slo_id = 1;
  int32 limit = 2;
}

message ListSloRevisionsResponse { repeated AlertSloRevisionV1 items = 1; }

message GetSloStatusRequest {
  string slo_id = 1;
  google.protobuf.Timestamp evaluated_at = 2;
}

message SloDataFreshnessV1 {
  // The three timestamps are minute-aligned, because the evaluation grid is.
  google.protobuf.Timestamp requested_through = 1;
  google.protobuf.Timestamp evaluated_through = 2;
  google.protobuf.Timestamp materialized_through = 3;
  // How far behind the request instant the materialization frontier is, in
  // seconds. Measured before `requested_through` is minute-aligned, so a reader
  // subtracting the two timestamps above will not always reproduce it: those are
  // grid positions, this is the staleness.
  //
  // Absent means no frontier is known — that is the only "unknown" this field
  // reports, and it is not interchangeable with 0. Zero means measured and not
  // behind.
  //
  // On GetSloStatus without `evaluated_at` the request instant is wall clock, so
  // this is wall-clock staleness of the served SLI.
  optional int64 materialization_lag_seconds = 4;
  bool clipped_to_materialized_through = 5;
  SliReadinessV1 readiness = 6;
}

message SloStatusV1 {
  string slo_id = 1;
  string slo_revision_id = 2;
  string sli_id = 3;
  string sli_revision_id = 4;
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
  double target_ratio = 7;
  optional double attainment_ratio = 8;
  optional double remaining_budget_ratio = 9;
  int64 eligible_event_count = 10;
  int64 good_event_count = 11;
  int64 bad_event_count = 12;
  int64 excluded_event_count = 13;
  SliCoverageStateV1 coverage_state = 14;
  string coverage_reason = 15;
  google.protobuf.Timestamp source_frontier = 16;
  optional double fast_burn_rate = 17;
  optional double slow_burn_rate = 18;
  repeated string linked_alert_definition_ids = 19;
  SloWindowModeV1 window_mode = 20;
  SloCalendarPeriodV1 calendar_period = 21;
  string calendar_timezone = 22;
  google.protobuf.Timestamp revision_effective_from = 23;
  google.protobuf.Timestamp period_start = 24;
  google.protobuf.Timestamp period_end = 25;
  google.protobuf.Timestamp error_budget_resets_at = 26;
  SloDataFreshnessV1 freshness = 27;
  // The four multi-window burn rates, carried through from
  // ObjectiveSloStatusV1 fields 27-30. Absent means "not computable from this
  // window", which is a different statement from zero, and no reader may
  // substitute one for the other.
  //
  // fast_long_burn_rate and slow_long_burn_rate are what the deprecated pair
  // (fields 17/18) mirrors, so a badge reading the long-window rates renders
  // exactly what it renders today. The short-window pair is what the two-field
  // shape cannot express at all, and reading all four is what lets 17/18 be
  // removed in a future release.
  optional double fast_short_burn_rate = 28;
  optional double fast_long_burn_rate = 29;
  optional double slow_short_burn_rate = 30;
  optional double slow_long_burn_rate = 31;
  // End-to-end processing freshness measured from OTLP ingress to the durable
  // live accumulator update. Unlike the lag reported on `freshness`, this does
  // not include intentional event-time lateness or idle wall-clock time.
  optional int64 processing_freshness_millis = 32;
  // What this window dropped at the deterministic lateness cutoff, rolled up
  // from ObjectiveSloStatusV1 fields 33-34. Zero is the ordinary answer; a
  // nonzero count means the four counters above describe less than the window
  // actually saw, and the minutes carrying it must never render as a plain
  // "Complete". Events whose start fell in the window and whose arrival did
  // not — commonly spans longer than the lateness window.
  int64 late_excluded_event_count = 33;
  int64 late_lossy_minute_count = 34;
}

message GetSloBurndownRequest {
  string slo_id = 1;
  google.protobuf.Timestamp range_start = 2;
  google.protobuf.Timestamp range_end = 3;
  int64 step_seconds = 4;
  int32 max_points = 5;
}

message GetSloBurndownResponse {
  repeated SloStatusV1 points = 1;
  SloDataFreshnessV1 freshness = 2;
}

message ListSloHistoryRequest {
  string slo_id = 1;
  int32 limit = 2;
}

message ListSloHistoryResponse { repeated SloStatusV1 points = 1; }

// Which optional series a burndown chart needs. Mirrors
// ObjectiveBurndownProjectionV1: all-false means all four, so a caller that
// states nothing is asking for everything.
message SloBurndownProjectionV1 {
  bool attainment_ratio = 1;
  bool remaining_budget_ratio = 2;
  bool fast_burn_rate = 3;
  bool slow_burn_rate = 4;
}

// One materialized status point on a batched series.
//
// Deliberately narrower than SloStatusV1. A burndown renders the series; the
// wide message additionally carries plan identity, window bounds, the four raw
// counters and the calendar configuration, all of which are constant across a
// series or irrelevant to it. Repeating them per point is what makes a
// 1440-point chart expensive to encode — read them once from the entry summary.
//
// A ratio that was not requested by the projection is absent. A ratio that was
// requested but is not computable for that window is also absent — the
// projection echoed on the series says which of the two applies, and callers
// must read it before treating an absent field as "no data".
message SloBurndownPointV1 {
  google.protobuf.Timestamp window_end = 1;
  string slo_revision_id = 2;
  optional double attainment_ratio = 3;
  optional double remaining_budget_ratio = 4;
  optional double fast_burn_rate = 5;
  optional double slow_burn_rate = 6;
  SliCoverageStateV1 coverage_state = 7;
  google.protobuf.Timestamp source_frontier = 8;
}

// Where one SLO revision stopped describing the series and the next began.
//
// Both sides are carried so a chart can break the line rather than draw a
// segment implying the two revisions measured the same objective.
message SloRevisionBoundaryV1 {
  string previous_slo_revision_id = 1;
  google.protobuf.Timestamp previous_window_end = 2;
  string next_slo_revision_id = 3;
  google.protobuf.Timestamp next_window_end = 4;
}

// What the returned authority covers, stated rather than interpolated.
//
// A series is never padded, extrapolated, or carried forward to fill a
// requested range. Where authority stops, the points stop and the shortfall is
// reported here.
message SloSeriesCoverageV1 {
  google.protobuf.Timestamp requested_start = 1;
  google.protobuf.Timestamp requested_end = 2;
  bool complete = 3;
  // Absent when no authority was found anywhere in the request.
  google.protobuf.Timestamp covered_start = 4;
  google.protobuf.Timestamp covered_end = 5;
  int64 missing_leading_nanos = 6;
  int64 missing_trailing_nanos = 7;
  string reason = 8;
}

message SloBurndownSeriesV1 {
  repeated SloBurndownPointV1 points = 1;
  SloSeriesCoverageV1 coverage = 2;
  repeated SloRevisionBoundaryV1 revision_boundaries = 3;
  // Echoed so an absent ratio is unambiguous. See SloBurndownPointV1.
  SloBurndownProjectionV1 projection = 4;
}

message SloBurndownSelectorV1 {
  string slo_id = 1;
  // Empty selects the active revision for slo_id.
  string slo_revision_id = 2;
}

// Tenant and organization come from the authenticated call, not the body.
message GetSloBurndownBatchRequest {
  repeated SloBurndownSelectorV1 selectors = 1;
  google.protobuf.Timestamp range_start = 2;
  google.protobuf.Timestamp range_end = 3;
  int64 step_seconds = 4;
  int32 max_points_per_series = 5;
  SloBurndownProjectionV1 projection = 6;
  // Both false means both, on the same reasoning as an all-false projection: a
  // caller that states nothing is asking for everything, so a client that has
  // not been taught to narrow the response never gets an empty one.
  //
  // include_summary carries a full SloStatusV1 per entry and costs a definition
  // read per selector. A dashboard that only draws lines should set
  // include_series alone.
  bool include_summary = 7;
  bool include_series = 8;
}

// One selector's answer. A selector that cannot be served sets
// unavailable_reason and leaves summary and series unset, so one bad SLO in a
// twenty-SLO dashboard does not fail the other nineteen.
message SloBurndownEntryV1 {
  string slo_id = 1;
  string slo_revision_id = 2;
  SloStatusV1 summary = 3;
  SloBurndownSeriesV1 series = 4;
  string unavailable_reason = 5;
}

// Entries are returned in request order, one per selector.
message GetSloBurndownBatchResponse {
  repeated SloBurndownEntryV1 entries = 1;
}

// Which outcome class a drill-down is asking about. Mirrors
// ObjectiveOutcomeV1.
//
// UNSPECIFIED means all three. This is not the all-false trap
// SloBurndownProjectionV1 documents: the enum's zero value already reads as
// "unfiltered" upstream, so a client that never sets it gets everything.
enum SloEvidenceOutcomeV1 {
  SLO_EVIDENCE_OUTCOME_V1_UNSPECIFIED = 0;
  SLO_EVIDENCE_OUTCOME_V1_GOOD = 1;
  SLO_EVIDENCE_OUTCOME_V1_BAD = 2;
  SLO_EVIDENCE_OUTCOME_V1_EXCLUDED = 3;
}

// One telemetry row the objective evaluator classified, addressed well enough
// for a client to open it.
//
// Every identifier the evaluator captured crosses as its own typed field. This
// is deliberately not AlertEvidenceRefV1, the shape PreviewSli uses: that one
// carries a single `kind`/`id` pair plus a JSON attribute bag, so a metric
// reference loses the metric_id/series_id pair that addresses it and a span
// reference loses its span_id to a stringified attribute. A drill-down cannot be
// built from that.
//
// identity_available is false when SLI redaction or a missing column left the
// row unaddressable. Such a reference still counted toward the observed_* totals
// on the set, so render it as an unlinkable sample rather than dropping it.
//
// ObjectiveEvidenceReferenceV1.source is not carried. It is the Redpanda
// coordinate the evaluator read the row from — topic, partition, offset range,
// assignment generation, fencing token, envelope identity. Those address a
// broker range in the ingestion plane, not a telemetry row, and no query surface
// in this product accepts them.
message SloEvidenceRefV1 {
  SliSignalV1 signal = 1;
  SloEvidenceOutcomeV1 outcome = 2;
  // The row's own event time, not the minute bucket it was counted in.
  google.protobuf.Timestamp event_time = 3;
  string service_name = 4;
  string service_namespace = 5;
  string environment = 6;
  string deployment = 7;
  // Lowercase hex. Empty when the signal carries no such identifier or the SLI
  // redacted the field.
  string trace_id = 8;
  string span_id = 9;
  string log_id = 10;
  uint64 metric_id = 11;
  uint64 series_id = 12;
  string exemplar_trace_id = 13;
  string eval_id = 14;
  // Stable identity of this reference across repeated reads of the same minute:
  // lowercase hex of the evaluator's digest. Carried as hex rather than the
  // upstream `bytes` so it stays a plain string key in a browser client. Opaque
  // — compare it, never parse it.
  string sample_hash = 15;
  bool identity_available = 16;
}

// Every reference the evaluator retained for one minute, plus what it observed.
//
// The five lists are a bounded sample, not the population: at most one first
// failure, one last failure, eight representative failures, two successes and
// two excluded rows survive per minute. observed_*_count are the real totals and
// `truncated` says the sample is smaller than what was observed, so a drill-down
// header reads the counts and the body renders the sample.
//
// ObjectiveEvidenceSetV1.tenant_id is not carried; the tenant is the
// authenticated caller.
message SloEvidenceSetV1 {
  string sli_revision_id = 1;
  google.protobuf.Timestamp minute_start = 2;
  repeated SloEvidenceRefV1 first_failures = 3;
  repeated SloEvidenceRefV1 last_failures = 4;
  repeated SloEvidenceRefV1 representative_failures = 5;
  repeated SloEvidenceRefV1 representative_successes = 6;
  repeated SloEvidenceRefV1 representative_excluded = 7;
  uint64 observed_good_count = 8;
  uint64 observed_bad_count = 9;
  uint64 observed_excluded_count = 10;
  bool truncated = 11;
}

// One requested minute's answer, on the same partial-success contract as
// SloBurndownEntryV1: a minute that cannot be served sets unavailable_reason and
// leaves evidence unset, so one gap does not fail the surrounding window.
message SloEvidenceMinuteV1 {
  google.protobuf.Timestamp minute_start = 1;
  // Unset whenever unavailable_reason is set.
  SloEvidenceSetV1 evidence = 2;
  // A minute the evaluator recorded no evidence for is the ordinary case, not a
  // failure, and reads as such. Absent evidence is never a zero-count set.
  string unavailable_reason = 3;
}

// Tenant and organization come from the authenticated call, not the body.
message GetSloEvidenceRequest {
  string slo_id = 1;
  // Empty selects the active revision for slo_id.
  string slo_revision_id = 2;
  // Truncated to its minute. The window read is
  // [minute_start, minute_start + minute_count minutes).
  google.protobuf.Timestamp minute_start = 3;
  // 0 means 1, so the zero value is the single-minute read the upstream RPC
  // takes. Each minute costs one read against the objective authority, and the
  // cap is one bucket of the widest burndown this service draws.
  uint32 minute_count = 4;
  // UNSPECIFIED returns all three outcome classes.
  SloEvidenceOutcomeV1 outcome = 5;
}

// Minutes are returned in ascending order, one per requested minute.
message GetSloEvidenceResponse {
  string slo_id = 1;
  // The SLO revision that answered — the active one unless the request pinned
  // another.
  string slo_revision_id = 2;
  // The SLI revision the evidence was recorded under. Evidence is keyed by SLI
  // revision upstream, so this is what the references are actually about; a
  // minute whose set claims a different one is reported unavailable rather than
  // served under an identity the bridge could not confirm.
  string sli_revision_id = 3;
  repeated SloEvidenceMinuteV1 minutes = 4;
}

// Which prior window a period is measured against. Mirrors
// ObjectiveComparisonPresetV1.
//
// Every preset but CUSTOM derives the comparison period from the current one.
// The two calendar-month presets additionally derive the current period from
// current_end, so for those current_start is validated but not otherwise used.
// UNSPECIFIED behaves as PREVIOUS_PERIOD.
enum SloComparisonPresetV1 {
  SLO_COMPARISON_PRESET_V1_UNSPECIFIED = 0;
  SLO_COMPARISON_PRESET_V1_PREVIOUS_PERIOD = 1;
  SLO_COMPARISON_PRESET_V1_PREVIOUS_WEEK = 2;
  SLO_COMPARISON_PRESET_V1_PREVIOUS_FOUR_WEEKS = 3;
  SLO_COMPARISON_PRESET_V1_PREVIOUS_MONTH = 4;
  SLO_COMPARISON_PRESET_V1_PREVIOUS_THREE_MONTHS = 5;
  SLO_COMPARISON_PRESET_V1_CUSTOM = 6;
}

// How much of a period the returned authority actually covers, counted in
// minutes. Mirrors ObjectiveRangeReadinessV1.
//
// `complete` is the gate on the period's ratios: a period missing minutes has no
// attainment to report, because the missing minutes could hold any number of
// bad events.
message SloRangeReadinessV1 {
  bool complete = 1;
  uint64 expected_minutes = 2;
  uint64 observed_minutes = 3;
  uint64 missing_minutes = 4;
  uint64 partial_minutes = 5;
  uint64 stale_minutes = 6;
  uint64 error_minutes = 7;
  google.protobuf.Timestamp first_incomplete_minute = 8;
  google.protobuf.Timestamp source_frontier = 9;
  string reason = 10;
}

// One side of a period-over-period report.
//
// The four counters take SloStatusV1's names and int64 type rather than
// ObjectivePeriodSummaryV1's bare `eligible`/`good`/`bad`/`excluded` uint64s: a
// comparison tile renders these beside the status tile's counters, and the same
// four numbers must not arrive under two names in one proto. Where the alerts
// proto already names a concept, the bridged shape uses that name.
message SloPeriodSummaryV1 {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  int64 eligible_event_count = 3;
  int64 good_event_count = 4;
  int64 bad_event_count = 5;
  int64 excluded_event_count = 6;
  // Absent unless readiness.complete is true and the period had eligible events.
  // Absent means "not computable over this period" and is never zero.
  optional double attainment_ratio = 7;
  optional double remaining_budget_ratio = 8;
  SloRangeReadinessV1 readiness = 9;
}

// Tenant and organization come from the authenticated call, not the body.
message CompareSloPeriodsRequest {
  string slo_id = 1;
  // Empty selects the active revision for slo_id.
  string slo_revision_id = 2;
  SloComparisonPresetV1 preset = 3;
  // Truncated to the minute. Both periods are half-open: [start, end).
  google.protobuf.Timestamp current_start = 4;
  google.protobuf.Timestamp current_end = 5;
  // Read only when preset is CUSTOM.
  google.protobuf.Timestamp comparison_start = 6;
  google.protobuf.Timestamp comparison_end = 7;
  // IANA zone name. Required by PREVIOUS_MONTH and PREVIOUS_THREE_MONTHS, which
  // align to local calendar month starts; ignored by every other preset. Left
  // empty on a calendar SLO it defaults to that SLO's own calendar_timezone, so
  // a monthly comparison is cut on the same boundaries the objective is.
  string timezone = 8;
}

// Both periods are summed under the one SLI revision the answering SLO revision
// names. When the SLO was revised between the two periods, the older period has
// no minutes under that SLI revision and comes back with readiness.complete
// false and absent ratios — the comparison declines rather than comparing two
// different definitions of the same objective. Show slo_revision_id with the
// result.
message CompareSloPeriodsResponse {
  string slo_id = 1;
  string slo_revision_id = 2;
  string sli_revision_id = 3;
  SloPeriodSummaryV1 current = 4;
  SloPeriodSummaryV1 comparison = 5;
  // Absent whenever either side's ratio is absent. A delta of zero means the two
  // periods matched, which is a different statement from "not comparable".
  optional double attainment_delta = 6;
  optional double remaining_budget_delta = 7;
}

