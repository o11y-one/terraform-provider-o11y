// What followed an audited decision. `basis` is how to read it:
//   "in_force_window" — a decision on a rule. Everything the rule did from the decision until the next one that
//                       changed its mode or revision. This is "while it was in force", never "because of it":
//                       an evaluator effect is caused by data and configuration together.
//   "direct"          — a decision on an incident. What that incident did afterwards.
//   "not_applicable"  — the decision has no runtime effects to show; render nothing.
message AlertAuditEffectsV1 {
  string audit_event_id = 1;
  string basis = 2;
  google.protobuf.Timestamp in_force_from = 3;
  // Unset while the decision still stands.
