syntax = "proto3";

package o11y_one.alerts.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum AlertClassV1 {
  ALERT_CLASS_V1_UNSPECIFIED = 0;
  ALERT_CLASS_V1_OUTCOME = 1;
  ALERT_CLASS_V1_BUDGET = 2;
  ALERT_CLASS_V1_SYMPTOM = 3;
  ALERT_CLASS_V1_SYSTEM = 4;
}

enum AlertModeV1 {
  ALERT_MODE_V1_UNSPECIFIED = 0;
  ALERT_MODE_V1_SHADOW = 1;
  ALERT_MODE_V1_NOTIFY = 2;
  ALERT_MODE_V1_DISABLED = 3;
}

enum AlertSeverityV1 {
  ALERT_SEVERITY_V1_UNSPECIFIED = 0;
  ALERT_SEVERITY_V1_INFO = 1;
  ALERT_SEVERITY_V1_WARNING = 2;
  ALERT_SEVERITY_V1_CRITICAL = 3;
}

enum AlertDestinationKindV1 {
  ALERT_DESTINATION_KIND_V1_UNSPECIFIED = 0;
  ALERT_DESTINATION_KIND_V1_EMAIL = 1;
  ALERT_DESTINATION_KIND_V1_WEBHOOK = 2;
  ALERT_DESTINATION_KIND_V1_SLACK = 3;
  ALERT_DESTINATION_KIND_V1_PAGERDUTY = 4;
}

message AlertOwnerRefV1 {
  oneof owner {
    string team_id = 1;
    string user_id = 2;
  }
  string display_name = 3;
  bool active = 4;
}

message AlertActionV1 {
  string summary = 1;
  string first_action = 2;
  string managed_runbook_id = 3;
  string external_runbook_url = 4;
}

message AgentQualityRegressionConfigV1 {
  optional int64 short_window_seconds = 1;
  optional int64 long_window_seconds = 2;
  optional int64 baseline_window_seconds = 3;
  optional uint64 min_run_count = 4;
  optional double max_bad_outcome_rate = 5;
  optional double max_eval_fail_rate = 6;
  optional double min_eval_pass_rate = 7;
  optional double baseline_bad_outcome_rate = 8;
  optional double regression_multiplier = 9;
  optional uint32 evidence_limit = 10;
}

message CostPerSuccessConfigV1 {
  optional int64 window_seconds = 1;
  optional uint64 min_success_count = 2;
  optional double max_cost_per_success_usd = 3;
  optional double baseline_cost_per_success_usd = 4;
  optional double regression_multiplier = 5;
  optional bool allow_estimated_cost = 6;
  optional double budget_remaining_usd = 7;
  optional double imminent_exhaustion_hours = 8;
  optional uint32 evidence_limit = 9;
}

message SloBurnConfigV1 {
  optional int64 fast_short_window_seconds = 1;
  optional int64 fast_long_window_seconds = 2;
  optional int64 slow_short_window_seconds = 3;
  optional int64 slow_long_window_seconds = 4;
  optional int64 slo_window_seconds = 5;
  optional double target_percent = 6;
  optional double fast_burn_threshold = 7;
  optional double slow_burn_threshold = 8;
  optional uint64 min_request_count = 9;
  optional uint32 evidence_limit = 10;
  string slo_id = 11;
  string slo_revision_id = 12;
  string fact_family = 13;
  string eligible_event_field = 14;
  string good_event_field = 15;
}

enum SliIndicatorKindV1 {
  SLI_INDICATOR_KIND_V1_UNSPECIFIED = 0;
  SLI_INDICATOR_KIND_V1_AVAILABILITY = 1;
  SLI_INDICATOR_KIND_V1_LATENCY = 2;
  SLI_INDICATOR_KIND_V1_AGENT_OUTCOME = 3;
  SLI_INDICATOR_KIND_V1_EVAL_QUALITY = 4;
  SLI_INDICATOR_KIND_V1_TOOL_SUCCESS = 5;
  SLI_INDICATOR_KIND_V1_COST_PER_SUCCESSFUL_OUTCOME = 6;
}

enum SliAggregationV1 {
  SLI_AGGREGATION_V1_UNSPECIFIED = 0;
  SLI_AGGREGATION_V1_EVENT_RATIO = 1;
  SLI_AGGREGATION_V1_THRESHOLD_RATIO = 2;
}

enum SliMissingDataBehaviorV1 {
  SLI_MISSING_DATA_BEHAVIOR_V1_UNSPECIFIED = 0;
  SLI_MISSING_DATA_BEHAVIOR_V1_UNKNOWN = 1;
  SLI_MISSING_DATA_BEHAVIOR_V1_GOOD = 2;
  SLI_MISSING_DATA_BEHAVIOR_V1_BAD = 3;
}

enum SliCoverageStateV1 {
  SLI_COVERAGE_STATE_V1_UNSPECIFIED = 0;
  SLI_COVERAGE_STATE_V1_COMPLETE = 1;
  SLI_COVERAGE_STATE_V1_NO_DATA = 2;
  SLI_COVERAGE_STATE_V1_PARTIAL = 3;
  SLI_COVERAGE_STATE_V1_UNAVAILABLE = 4;
}

message AlertSliRevisionV1 {
  string id = 1;
  string sli_id = 2;
  int32 revision_number = 3;
  SliIndicatorKindV1 indicator_kind = 4;
  google.protobuf.Struct scope = 5;
  AlertOwnerRefV1 owner = 6;
  google.protobuf.Struct eligible_events = 7;
  google.protobuf.Struct good_events = 8;
  google.protobuf.Struct excluded_events = 9;
  SliAggregationV1 aggregation = 10;
  optional double threshold = 11;
  SliMissingDataBehaviorV1 missing_data_behavior = 12;
  string config_hash = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
}

message AlertSliV1 {
  string id = 1;
  string sli_key = 2;
  string name = 3;
  string description = 4;
  string current_revision_id = 5;
  string provenance = 6;
  google.protobuf.Timestamp archived_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  AlertSliRevisionV1 current_revision = 10;
}

message SliRevisionInputV1 {
  SliIndicatorKindV1 indicator_kind = 1;
  google.protobuf.Struct scope = 2;
  AlertOwnerRefV1 owner = 3;
  google.protobuf.Struct eligible_events = 4;
  google.protobuf.Struct good_events = 5;
  google.protobuf.Struct excluded_events = 6;
  SliAggregationV1 aggregation = 7;
  optional double threshold = 8;
  SliMissingDataBehaviorV1 missing_data_behavior = 9;
}

message CreateSliRequest {
  string sli_key = 1;
  string name = 2;
  string description = 3;
  SliRevisionInputV1 revision = 4;
  string idempotency_key = 5;
}

message UpdateSliRequest {
  string sli_id = 1;
  string expected_revision_id = 2;
  string name = 3;
  string description = 4;
  SliRevisionInputV1 revision = 5;
  string idempotency_key = 6;
}

message ValidateSliRequest { SliRevisionInputV1 revision = 1; }

message ValidateSliResponse {
  bool valid = 1;
  repeated AlertFieldViolationV1 violations = 2;
  repeated double supported_latency_thresholds_ms = 3;
  repeated double supported_cost_thresholds_usd = 4;
}

message GetSliRequest { string sli_id = 1; }

message ListSlisRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool include_archived = 3;
}

message ListSlisResponse {
  repeated AlertSliV1 items = 1;
  int64 total_count = 2;
}

message ArchiveSliRequest {
  string sli_id = 1;
  string idempotency_key = 2;
}

message ListSliRevisionsRequest {
  string sli_id = 1;
  int32 limit = 2;
}

message ListSliRevisionsResponse { repeated AlertSliRevisionV1 items = 1; }

message PreviewSliRequest {
  string sli_id = 1;
  string sli_revision_id = 2;
  google.protobuf.Timestamp range_start = 3;
  google.protobuf.Timestamp range_end = 4;
  optional uint32 evidence_limit = 5;
}

message SliPreviewV1 {
  string sli_id = 1;
  string sli_revision_id = 2;
  google.protobuf.Timestamp range_start = 3;
  google.protobuf.Timestamp range_end = 4;
  int64 eligible_event_count = 5;
  int64 good_event_count = 6;
  int64 bad_event_count = 7;
  int64 excluded_event_count = 8;
  optional double indicator_value = 9;
  SliCoverageStateV1 coverage_state = 10;
  string coverage_reason = 11;
  google.protobuf.Timestamp source_frontier = 12;
  repeated google.protobuf.Struct evidence = 13;
  bool evidence_truncated = 14;
}

message AlertSloRevisionV1 {
  string id = 1;
  string slo_id = 2;
  int32 revision_number = 3;
  string sli_id = 4;
  string sli_revision_id = 5;
  double target_ratio = 6;
  int64 rolling_window_seconds = 7;
  AlertOwnerRefV1 owner = 8;
  google.protobuf.Struct labels = 9;
  string config_hash = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
}

message AlertSloV1 {
  string id = 1;
  string slo_key = 2;
  string name = 3;
  string description = 4;
  string current_revision_id = 5;
  string provenance = 6;
  google.protobuf.Timestamp archived_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  AlertSloRevisionV1 current_revision = 10;
}

message SloRevisionInputV1 {
  string sli_id = 1;
  string sli_revision_id = 2;
  double target_ratio = 3;
  int64 rolling_window_seconds = 4;
  AlertOwnerRefV1 owner = 5;
  google.protobuf.Struct labels = 6;
}

message CreateSloRequest {
  string slo_key = 1;
  string name = 2;
  string description = 3;
  SloRevisionInputV1 revision = 4;
  string idempotency_key = 5;
}

message UpdateSloRequest {
  string slo_id = 1;
  string expected_revision_id = 2;
  string name = 3;
  string description = 4;
  SloRevisionInputV1 revision = 5;
  string idempotency_key = 6;
}

message GetSloRequest { string slo_id = 1; }

message ListSlosRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool include_archived = 3;
}

message ListSlosResponse {
  repeated AlertSloV1 items = 1;
  int64 total_count = 2;
}

message ArchiveSloRequest {
  string slo_id = 1;
  string idempotency_key = 2;
}

message ListSloRevisionsRequest {
  string slo_id = 1;
  int32 limit = 2;
}

message ListSloRevisionsResponse { repeated AlertSloRevisionV1 items = 1; }

message GetSloStatusRequest {
  string slo_id = 1;
  google.protobuf.Timestamp evaluated_at = 2;
}

message SloStatusV1 {
  string slo_id = 1;
  string slo_revision_id = 2;
  string sli_id = 3;
  string sli_revision_id = 4;
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
  double target_ratio = 7;
  optional double attainment_ratio = 8;
  optional double remaining_budget_ratio = 9;
  int64 eligible_event_count = 10;
  int64 good_event_count = 11;
  int64 bad_event_count = 12;
  int64 excluded_event_count = 13;
  SliCoverageStateV1 coverage_state = 14;
  string coverage_reason = 15;
  google.protobuf.Timestamp source_frontier = 16;
  optional double fast_burn_rate = 17;
  optional double slow_burn_rate = 18;
  repeated string linked_alert_definition_ids = 19;
}

message GetSloBurndownRequest {
  string slo_id = 1;
  google.protobuf.Timestamp range_start = 2;
  google.protobuf.Timestamp range_end = 3;
  int64 step_seconds = 4;
  int32 max_points = 5;
}

message GetSloBurndownResponse { repeated SloStatusV1 points = 1; }

message ListSloHistoryRequest {
  string slo_id = 1;
  int32 limit = 2;
}

message ListSloHistoryResponse { repeated SloStatusV1 points = 1; }

message CreateRecommendedSloBurnAlertRequest {
  string slo_id = 1;
  AlertSeverityV1 severity = 2;
  AlertOwnerRefV1 owner = 3;
  AlertActionV1 action = 4;
  string idempotency_key = 5;
}

message CreateRecommendedSloBurnAlertResponse {
  repeated AlertDefinitionV1 definitions = 1;
}

message AdvancedSignalConfigV1 {
  optional uint64 min_log_errors = 1;
  optional double max_log_error_rate = 2;
  optional uint64 min_tool_failures = 3;
  optional uint64 min_fallback_count = 4;
  optional double max_cache_miss_rate = 5;
  optional bool symptom_only_page_override = 6;
  optional uint32 evidence_limit = 7;
}

message AlertDetectorConfigV1 {
  oneof config {
    AgentQualityRegressionConfigV1 agent_quality_regression = 1;
    CostPerSuccessConfigV1 cost_per_success = 2;
    SloBurnConfigV1 slo_burn = 3;
    AdvancedSignalConfigV1 advanced_signal = 4;
  }
}

message AlertFieldViolationV1 {
  string field = 1;
  string description = 2;
}

message AlertErrorDetailsV1 {
  string code = 1;
  repeated AlertFieldViolationV1 field_violations = 2;
  string current_revision_id = 3;
  string dependency = 4;
  string request_id = 5;
}

message AlertDefinitionV1 {
  string id = 1;
  string tenant_id = 2;
  string org_id = 3;
  string slug = 4;
  string name = 5;
  string description = 6;
  AlertClassV1 class = 7;
  AlertModeV1 mode = 8;
  AlertSeverityV1 severity = 9;
  google.protobuf.Struct scope = 10;
  google.protobuf.Struct owner = 11;
  google.protobuf.Struct action = 12;
  google.protobuf.Struct evaluation_settings = 13;
  google.protobuf.Struct sample_guard = 14;
  string current_revision_id = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  string detector_kind = 18;
  google.protobuf.Struct recipe_config = 19;
  int64 evaluation_interval_seconds = 20;
  AlertDetectorConfigV1 detector_config = 21;
  AlertOwnerRefV1 owner_ref = 22;
  AlertActionV1 alert_action = 23;
  string candidate_revision_id = 24;
  AlertDefinitionRuntimeSummaryV1 runtime = 25;
  AlertManagedResourceV1 management = 26;
}

message AlertManagedResourceV1 {
  string managed_by = 1;
  string management_ref = 2;
  string actor_id = 3;
  int64 revision = 4;
  string config_hash = 5;
  bool editable = 6;
  string immutable_reason = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message AlertDefinitionRuntimeSummaryV1 {
  google.protobuf.Timestamp last_evaluated_at = 1;
  google.protobuf.Timestamp next_evaluation_at = 2;
  string evaluation_health = 3;
  int64 active_instance_count = 4;
  string highest_lifecycle_state = 5;
  bool preview_approved = 6;
  bool activation_ready = 7;
  int64 matching_route_count = 8;
  string delivery_health = 9;
  bool paused = 10;
  bool archived = 11;
}

enum AlertNoDataBehaviorV1 {
  ALERT_NO_DATA_BEHAVIOR_V1_UNSPECIFIED = 0;
  ALERT_NO_DATA_BEHAVIOR_V1_HOLD_STATE = 1;
  ALERT_NO_DATA_BEHAVIOR_V1_RESOLVE = 2;
  ALERT_NO_DATA_BEHAVIOR_V1_ALERT = 3;
}

message AlertScopeV1 {
  repeated string service_names = 1;
  repeated string service_namespaces = 2;
  repeated string environments = 3;
  repeated string customer_cohorts = 4;
  repeated string agent_names = 5;
  repeated string model_providers = 6;
  repeated string models = 7;
  repeated string tool_names = 8;
}

message AlertEvaluationSettingsV1 {
  int64 interval_seconds = 1;
  int64 pending_for_seconds = 2;
  int64 recovering_for_seconds = 3;
  AlertNoDataBehaviorV1 no_data_behavior = 4;
  int64 preview_horizon_seconds = 5;
  uint32 evidence_limit = 6;
}

message AlertSampleGuardV1 {
  uint64 minimum_events = 1;
  bool require_complete_coverage = 2;
}

message AlertRevisionV1 {
  string id = 1;
  string definition_id = 2;
  int32 revision_number = 3;
  string name = 4;
  optional string description = 5;
  string config_hash = 6;
  string revision_hash = 7;
  AlertClassV1 class = 8;
  AlertModeV1 mode = 9;
  AlertSeverityV1 severity = 10;
  AlertScopeV1 scope = 11;
  AlertOwnerRefV1 owner = 12;
  AlertActionV1 action = 13;
  AlertEvaluationSettingsV1 evaluation_settings = 14;
  AlertSampleGuardV1 sample_guard = 15;
  AlertDetectorConfigV1 detector_config = 16;
  string detector_kind = 17;
  string lifecycle_state = 18;
  string source_revision_id = 19;
  string change_reason = 20;
  string created_by = 21;
  google.protobuf.Timestamp activated_at = 22;
  google.protobuf.Timestamp superseded_at = 23;
  google.protobuf.Timestamp created_at = 24;
}

message AlertRevisionDiffEntryV1 {
  string field = 1;
  string before_value = 2;
  string after_value = 3;
  bool sensitive = 4;
}

message AlertRevisionDiffV1 {
  string from_revision_id = 1;
  string to_revision_id = 2;
  repeated AlertRevisionDiffEntryV1 changes = 3;
  bool truncated = 4;
}

message AlertInstanceV1 {
  string id = 1;
  string definition_id = 2;
  string instance_key = 3;
  string dedupe_key = 4;
  string condition_state = 5;
  string lifecycle_state = 6;
  string routing_state = 7;
  AlertSeverityV1 severity = 8;
  string state_reason = 9;
  string last_eval_run_id = 10;
  string last_detector_result_id = 11;
  google.protobuf.Timestamp first_firing_at = 12;
  google.protobuf.Timestamp last_state_change_at = 13;
  google.protobuf.Timestamp resolved_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message AlertEvalRunV1 {
  string id = 1;
  string definition_id = 2;
  string revision_id = 3;
  string state = 4;
  string worker_id = 5;
  google.protobuf.Timestamp scheduled_for = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  string error_message = 9;
  google.protobuf.Struct facts_summary = 10;
  google.protobuf.Struct metadata = 11;
}

message AlertStateEventV1 {
  string id = 1;
  string instance_id = 2;
  string definition_id = 3;
  string eval_run_id = 4;
  string from_condition_state = 5;
  string to_condition_state = 6;
  string from_lifecycle_state = 7;
  string to_lifecycle_state = 8;
  string from_routing_state = 9;
  string to_routing_state = 10;
  string reason = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message AlertPreviewRunV1 {
  string id = 1;
  string definition_id = 2;
  string revision_id = 3;
  int32 predicted_firing_count = 4;
  int32 predicted_notification_count = 5;
  google.protobuf.Struct sample_guard_result = 6;
  google.protobuf.Value evidence_refs = 7;
  google.protobuf.Value activation_blockers = 8;
  google.protobuf.Struct result = 9;
  google.protobuf.Timestamp created_at = 10;
  AlertPreviewCoverageV1 coverage = 11;
  AlertPreviewSampleGuardResultV1 typed_sample_guard = 12;
  repeated AlertPreviewRouteDecisionV1 route_decisions = 13;
  AlertPreviewNoiseBudgetEffectV1 noise_budget_effect = 14;
  google.protobuf.Timestamp range_start = 15;
  google.protobuf.Timestamp range_end = 16;
  uint32 evidence_limit = 17;
}

enum AlertPreviewCoverageStateV1 {
  ALERT_PREVIEW_COVERAGE_STATE_V1_UNSPECIFIED = 0;
  ALERT_PREVIEW_COVERAGE_STATE_V1_COMPLETE = 1;
  ALERT_PREVIEW_COVERAGE_STATE_V1_NO_DATA = 2;
  ALERT_PREVIEW_COVERAGE_STATE_V1_PARTIAL = 3;
  ALERT_PREVIEW_COVERAGE_STATE_V1_ERROR = 4;
}

message AlertPreviewCoverageV1 {
  AlertPreviewCoverageStateV1 state = 1;
  string reason = 2;
  repeated string fact_families = 3;
  bool horizon_complete = 4;
}

message AlertPreviewSampleGuardResultV1 {
  bool passed = 1;
  uint64 observed_events = 2;
  uint64 required_events = 3;
  string reason = 4;
}

message AlertPreviewRouteDecisionV1 {
  google.protobuf.Timestamp evaluated_at = 1;
  string instance_key = 2;
  string routing_state = 3;
  repeated string selected_destination_ids = 4;
  repeated string blockers = 5;
}

message AlertPreviewNoiseBudgetEffectV1 {
  int64 projected_notifications_per_day = 1;
  bool hard_gate_applied = 2;
  string projection_confidence = 3;
  repeated string blockers = 4;
}

message AlertDeliveryHistoryV1 {
  string id = 1;
  string notification_event_id = 2;
  string event_type = 3;
  string destination_id = 4;
  AlertDestinationKindV1 destination_kind = 5;
  string destination_key = 6;
  string status = 7;
  int32 attempts = 8;
  string last_error = 9;
  string provider_message_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string definition_id = 13;
  string revision_id = 14;
  string instance_id = 15;
  string incident_id = 16;
  repeated AlertDeliveryAttemptV1 attempt_history = 17;
}

message AlertDeliveryAttemptV1 {
  int32 attempt_number = 1;
  string status = 2;
  int32 provider_status_code = 3;
  string provider_message_id = 4;
  string error_class = 5;
  string error_message = 6;
  int32 elapsed_ms = 7;
  google.protobuf.Timestamp attempted_at = 8;
}

enum AlertDestinationVerificationStateV1 {
  ALERT_DESTINATION_VERIFICATION_STATE_V1_UNSPECIFIED = 0;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_UNCONFIGURED = 1;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_MISSING_SECRETS = 2;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_UNVERIFIED = 3;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_VERIFYING = 4;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_VERIFIED = 5;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_FAILED = 6;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_STALE = 7;
  ALERT_DESTINATION_VERIFICATION_STATE_V1_DISABLED = 8;
}

message AlertDestinationFieldRequirementV1 {
  string field = 1;
  bool required = 2;
  bool secret = 3;
  string description = 4;
}

message AlertDestinationSetupRequirementsV1 {
  AlertDestinationKindV1 kind = 1;
  repeated AlertDestinationFieldRequirementV1 fields = 2;
}

message AlertDestinationVerificationV1 {
  AlertDestinationVerificationStateV1 state = 1;
  string current_configuration_generation = 2;
  string verified_configuration_generation = 3;
  int64 secret_material_generation = 4;
  string last_attempt_status = 5;
  int32 provider_status_code = 6;
  string provider_receipt = 7;
  google.protobuf.Timestamp attempted_at = 8;
  google.protobuf.Timestamp succeeded_at = 9;
  google.protobuf.Timestamp stale_at = 10;
  bool retryable = 11;
  string error_class = 12;
  string error_message = 13;
}

message AlertDestinationRouteUsageV1 {
  string policy_id = 1;
  string policy_key = 2;
  string route_id = 3;
  string route_key = 4;
  bool policy_enabled = 5;
  bool route_enabled = 6;
}

message AlertDestinationUsageV1 {
  repeated AlertDestinationRouteUsageV1 routes = 1;
  repeated string notify_definition_ids = 2;
  bool update_requires_reverification = 3;
  bool disable_blocks_notify = 4;
}

message AlertDestinationV1 {
  string id = 1;
  string destination_key = 2;
  string name = 3;
  AlertDestinationKindV1 kind = 4;
  bool enabled = 5;
  google.protobuf.Struct config = 6;
  google.protobuf.Struct secret_refs = 7;
  google.protobuf.Timestamp last_tested_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  AlertDestinationSetupRequirementsV1 setup_requirements = 11;
  AlertDestinationVerificationV1 verification = 12;
  AlertDestinationUsageV1 usage = 13;
}

message AlertMatcherValueV1 {
  oneof value {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
  }
}

message AlertMatcherClauseV1 {
  string field = 1;
  repeated AlertMatcherValueV1 values = 2;
}

message AlertNotificationRouteTargetV1 {
  oneof target {
    string destination_id = 1;
    string destination_key = 2;
  }
}

enum AlertNotificationRouteBehaviorV1 {
  ALERT_NOTIFICATION_ROUTE_BEHAVIOR_V1_UNSPECIFIED = 0;
  ALERT_NOTIFICATION_ROUTE_BEHAVIOR_V1_STOP = 1;
  ALERT_NOTIFICATION_ROUTE_BEHAVIOR_V1_CONTINUE = 2;
}

message AlertNotificationRouteV1 {
  string id = 1;
  string route_key = 2;
  int32 priority = 3;
  bool enabled = 4;
  repeated AlertMatcherClauseV1 matcher = 5;
  AlertNotificationRouteTargetV1 target = 6;
  AlertNotificationRouteBehaviorV1 behavior = 7;
}

message AlertNotificationPolicyConfigV1 {
  repeated AlertNotificationRouteV1 routes = 1;
  optional int32 max_pages_per_day = 2;
